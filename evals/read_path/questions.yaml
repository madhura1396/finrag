# Read-path form eval (ADR 0004, detail 7). Synthetic questions only; invented
# merchants and trips. Each `form` lists the fields the model should fill;
# any field not listed is expected to be empty (or its default).
# Never copy these into query_router.TEACH_EXAMPLES: run.py refuses overlap.

- question: How much did I spend on groceries in December?
  form: {type: total_spent, category: groceries, period: "--12"}
- question: What did I spend at Grocer Mart last month?
  form: {type: total_spent, merchant: grocer mart, period: last_month}
- question: Total spending this year?
  form: {type: total_spent, period: this_year}
- question: How much have I spent so far this month?
  form: {type: total_spent, period: this_month}
- question: How much did I spend on dining in October 2026?
  form: {type: total_spent, category: dining, period: "2026-10"}
- question: How much did the Lakeside trip cost me?
  form: {type: total_spent, trip: lakeside}
- question: What did I spend at FoodDash from May 5 to July 5?
  form: {type: total_spent, merchant: fooddash, period: "--05-05..--07-05"}
- question: How much did I spend in total?
  form: {type: total_spent}
- question: Spending on shopping last year
  form: {type: total_spent, category: shopping, period: last_year}
